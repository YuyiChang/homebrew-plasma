name: Bump plasma cask

# Polls PLASMA's GitHub Releases for a new tagged (non-prerelease) version
# and opens a PR here bumping Casks/plasma.rb's version + sha256. Runs
# entirely inside this repo, using its own default GITHUB_TOKEN — no
# cross-repo PAT needed, unlike automating this from PLASMA's own CI would.
#
# `plasma@nightly` needs none of this: it tracks a fixed release tag
# (`nightly`) with `version :latest` / `sha256 :no_check`, so there's
# nothing to bump there, ever.

on:
  schedule:
    - cron: '0 13 * * *'   # once a day; irrelevant how often since it's a no-op when nothing changed
  workflow_dispatch:        # trigger manually right after cutting a PLASMA release, instead of waiting

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest PLASMA release
        id: release
        run: |
          # GitHub's /releases/latest already excludes prereleases and drafts,
          # so this naturally skips the rolling "nightly" prerelease tag.
          LATEST_TAG="$(curl -fsSL https://api.github.com/repos/YuyiChang/PLASMA/releases/latest | jq -r .tag_name)"
          LATEST_VERSION="${LATEST_TAG#v}"
          CURRENT_VERSION="$(grep -oE 'version "[^"]+"' Casks/plasma.rb | head -1 | cut -d'"' -f2)"
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LATEST_VERSION" = "$CURRENT_VERSION" ]; then
            echo "up to date ($CURRENT_VERSION) — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumping $CURRENT_VERSION -> $LATEST_VERSION"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute new sha256
        if: steps.release.outputs.changed == 'true'
        id: sha
        run: |
          URL="https://github.com/YuyiChang/PLASMA/releases/download/v${{ steps.release.outputs.latest }}/PLASMA_MacOS_arm64.app.zip"
          curl -fsSL -o app.zip "$URL"
          echo "sha256=$(sha256sum app.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm app.zip

      - name: Bump Casks/plasma.rb
        if: steps.release.outputs.changed == 'true'
        run: |
          sed -i -E "s/version \"[^\"]+\"/version \"${{ steps.release.outputs.latest }}\"/" Casks/plasma.rb
          sed -i -E "s/sha256 \"[^\"]+\"/sha256 \"${{ steps.sha.outputs.sha256 }}\"/" Casks/plasma.rb

      - name: Open PR
        if: steps.release.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "plasma ${{ steps.release.outputs.latest }}"
          title: "plasma ${{ steps.release.outputs.latest }}"
          body: |
            Auto-bump from [PLASMA v${{ steps.release.outputs.latest }}](https://github.com/YuyiChang/PLASMA/releases/tag/v${{ steps.release.outputs.latest }}).

            sha256 computed from that release's `PLASMA_MacOS_arm64.app.zip`.
            Review before merging — this only checks that the version
            changed, not that the new build is actually good.
          branch: bump-plasma-${{ steps.release.outputs.latest }}
          delete-branch: true
